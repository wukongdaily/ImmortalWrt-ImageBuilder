name: Build Dev Board Firmware(Flippy)
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.1
      openwrt_kernel:
        description: "选择构建的内核【最新6.12.y默认】"
        required: false
        default: "6.12.y"
        type: choice
        options:
          - 5.4.y
          - 5.10.y
          - 5.15.y
          - 6.1.y
          - 6.6.y
          - 6.12.y
      openwrt_soc:
        description: "选择开发板型号"
        required: false
        default: "h68k"
        type: choice
        options:
          - e20c
          - e24c
          - e25
          - e52c
          - e54c
          - rock5b
          - rock5c
          - r66s
          - r68s
          - ht2
          - h28k
          - h66k
          - h68k
          - h69k
          - h69k-max
          - h88k
          - h88k-v3
          - jp-tvbox
          - l1pro
          - s905
          - s905x2
          - s905x3
          - s912
          - s922x
          - s922x-n2
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      skip_imagebuilder:
        description: "直接使用底包快速构建固件"
        required: false
        default: false
        type: boolean
      replace_banner:
        description: '替换为ImmortalWrt的banner信息'
        required: false
        default: false
        type: boolean
      rootfs_partsize:
        description: '软件包大小1G固定'
        required: true
        default: "1024"
        type: choice
        options:
          - '1024'
      builder_name:
        description: "设置打包作者的名称"
        required: true
        default: 'wukongdaily'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/n1/build.sh

      - name: Debug workspace contents
        run: ls -R

      - name: 处理是否替换 banner 信息
        if: ${{ github.event.inputs.skip_imagebuilder == 'false' && github.event.inputs.replace_banner == 'true' }}
        run: |
          cp n1/99-banner.sh files/etc/uci-defaults/

      - name: H68K 板型+CPU显示修复 + 彻底移除无线 + SOC温度【保留】
        if: ${{ github.event.inputs.skip_imagebuilder != 'true' }}
        run: |
          mkdir -p files/etc/uci-defaults
          mkdir -p files/sbin
          # 覆盖 /sbin/cpuinfo，LuCI系统页读取这个输出
          echo '#!/bin/sh' > files/sbin/cpuinfo
          echo 'echo "Cortex-A55 x4"' >> files/sbin/cpuinfo
          chmod +x files/sbin/cpuinfo

          # 写入板型型号信息
          echo '#!/bin/sh' > files/etc/uci-defaults/99-h68k-info
          echo 'echo "hinlink,h68k" > /tmp/sysinfo/board_name' >> files/etc/uci-defaults/99-h68k-info
          echo 'echo "Hinlink H68K (RK3568, 4×Cortex-A55)" > /tmp/sysinfo/model' >> files/etc/uci-defaults/99-h68k-info
          echo 'exit 0' >> files/etc/uci-defaults/99-h68k-info
          chmod +x files/etc/uci-defaults/99-h68k-info

          # 删除LuCI无线菜单文件
          echo '#!/bin/sh' > files/etc/uci-defaults/99-del-wifi
          echo 'rm -f /usr/lib/lua/luci/controller/admin/wireless.lua' >> files/etc/uci-defaults/99-del-wifi
          echo 'rm -f /usr/lib/lua/luci/view/admin_network/wireless.htm' >> files/etc/uci-defaults/99-del-wifi
          echo 'exit 0' >> files/etc/uci-defaults/99-del-wifi
          chmod +x files/etc/uci-defaults/99-del-wifi

          # 删除无线配置文件，彻底消除无线菜单入口
          echo '#!/bin/sh' > files/etc/uci-defaults/99-rm-wireless-config
          echo 'rm -f /etc/config/wireless' >> files/etc/uci-defaults/99-rm-wireless-config
          echo 'exit 0' >> files/etc/uci-defaults/99-rm-wireless-config
          chmod +x files/etc/uci-defaults/99-rm-wireless-config

          # 首页增加RK3568 SOC温度读取【保留】
          echo '#!/bin/sh' > files/etc/uci-defaults/99-add-temperature
          echo 'uci set luci.main.tempfile="/sys/class/thermal/thermal_zone0/temp"' >> files/etc/uci-defaults/99-add-temperature
          echo 'uci commit luci' >> files/etc/uci-defaults/99-add-temperature
          echo 'exit 0' >> files/etc/uci-defaults/99-add-temperature
          chmod +x files/etc/uci-defaults/99-add-temperature

      - name: Build Rootfs for Radxa and Other Boards (ImmortalWrt 25.12.1 + 内置OpenClash)
        if: ${{ github.event.inputs.skip_imagebuilder != 'true' }}
        run: |
          echo "✅ 使用 ImageBuilder 构建 rootfs 【内置OpenClash，内核可选6.12.y，SOC温度保留】"
          profiles="generic"
          include_docker="${{ github.event.inputs.include_docker }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          luci_version="${{ github.event.inputs.luci_version }}"

          IFS=',' read -r -a profile_array <<< "$profiles"

          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"

            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/files/sbin:/home/build/immortalwrt/files/sbin" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/n1/banner:/home/build/immortalwrt/files/mnt/banner" \
              -v "${{ github.workspace }}/n1/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/n1/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              # 25.12 Firewall4 nft全套OpenClash依赖
              -e PACKAGES="-kmod-cfg80211 -kmod-mac80211 -hostapd -wpa-supplicant -luci-proto-relayd lm-sensors -dnsmasq luci-app-openclash dnsmasq-full bash curl ca-bundle ip-full ruby ruby-yaml kmod-tun kmod-inet-diag unzip kmod-nft-tproxy luci-compat coreutils-nohup" \
              immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          done

      - name: Download prebuilt rootfs.tar.gz
        if: ${{ github.event.inputs.skip_imagebuilder == 'true' }}
        run: |
          echo "📦 正在下载预构建 rootfs"
          echo "PREBUILT_LUCI_VERSION=25.12.1" >> $GITHUB_ENV
          mkdir -p bin/targets/armsr/armv8
          curl -L -o bin/targets/armsr/armv8/openwrt-armvirt-64-default-rootfs.tar.gz \
            https://github.com/wukongdaily/AutoBuildImmortalWrt/releases/download/rootfs/immortalwrt-25.12.1-armsr-armv8-generic-rootfs.tar.gz

      - name: 查找rootfs.tar.gz所在路径
        id: find_rootfs
        run: |
          ROOTFS_FILE=$(find bin/targets/armsr/armv8 -type f -name "*rootfs.tar.gz" | head -n1)
          echo "✅ Found: $ROOTFS_FILE"
          if [ -z "$ROOTFS_FILE" ]; then
            echo "❌ 找不到 rootfs.tar.gz 文件"
            exit 1
          fi
          echo "file=$ROOTFS_FILE" >> $GITHUB_OUTPUT

      - name: Package armsr-armv8 as ImmortalWrt for H68K
        uses: wukongdaily/flippy-openwrt-actions@kernel-6.1
        if: ${{ steps.find_rootfs.outputs.file != '' }} && !cancelled()
        env:
          OPENWRT_ARMVIRT: ${{ steps.find_rootfs.outputs.file }}
          PACKAGE_SOC: ${{ inputs.openwrt_soc }}
          KERNEL_VERSION_NAME: ${{ inputs.openwrt_kernel }}
          KERNEL_AUTO_LATEST: true
          KERNEL_REPO_URL: "ophub/kernel"
          WHOAMI: ${{ inputs.builder_name }}

      - name: Rename .img.gz file
        id: rename
        run: |
          FILE=$(ls ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz | head -n1)
          echo "Image file is: $FILE"
          FILENAME=$(basename "$FILE")
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          KERNEL_VERSION=$(echo "$FILENAME" | grep -oP 'k\d+\.\d+\.\d+')
          MODEL=${{ inputs.openwrt_soc }}
          if [ -n "$PREBUILT_LUCI_VERSION" ]; then
            echo "PREBUILT_LUCI_VERSION is set"
            mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-${PREBUILT_LUCI_VERSION}-${MODEL}-btrfs-${KERNEL_VERSION}.img.gz"
          else
            LUCI_VERSION="${{ inputs.luci_version }}"
            mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/immortalwrt-${LUCI_VERSION}-${MODEL}-btrfs-${KERNEL_VERSION}.img.gz"
          fi

      - name: Upload firmware to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: flippy
          name: ImmortalWrt for Hinlink H68K
          body_path: ${{ github.workspace }}/n1/radxa.md
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
